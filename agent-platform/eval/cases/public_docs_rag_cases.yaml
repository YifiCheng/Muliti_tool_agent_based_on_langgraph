metadata:
  name: Public Docs RAG Evaluation
  description: Evaluation cases for public enterprise handbook RAG retrieval.
  rag_docs_dir: data/public_docs/clean

cases:
  - case_id: public_gitlab_communication_en
    category: rag
    query_language: en
    query: What does the GitLab handbook say about communication?
    expected_tools:
      - document_search
    expected_keywords:
      - communication
    expected_sources:
      - gitlab_handbook_communication.md
    require_evidence: true
    min_evidence_count: 1

