app:
  name: business-multi-tool-agent
  env: dev

llm:
  provider: qwen_api
  timeout_seconds: 60
  max_retries: 1
  queue_wait_timeout_seconds: 10
  max_output_tokens: 512
  qwen_api:
    base_url_env: QWEN_BASE_URL
    api_key_env: QWEN_API_KEY
    model_env: QWEN_MODEL
  remote_qwen:
    base_url_env: REMOTE_QWEN_BASE_URL
    api_key_env: REMOTE_QWEN_API_KEY
    model_env: REMOTE_QWEN_MODEL

rag:
  docs_dir: data/public_docs/clean
  index_dir: data/index
  chunk_size: 500
  chunk_overlap: 80
  top_k: 5
  enable_query_translation: true
  query_translation_strategy: rule_based


sql:
  backend: mysql
  sqlite_path: data/sql/business.db
  mysql_host_env: MYSQL_HOST
  mysql_port_env: MYSQL_PORT
  mysql_user_env: MYSQL_USER
  mysql_password_env: MYSQL_PASSWORD
  mysql_database_env: MYSQL_DATABASE
  mysql_charset: utf8mb4
  mysql_connect_timeout_seconds: 5
  mysql_read_timeout_seconds: 10
  mysql_write_timeout_seconds: 10
  max_rows: 50
  timeout_seconds: 5

redis:
  enabled: true
  host_env: REDIS_HOST
  port_env: REDIS_PORT
  db_env: REDIS_DB
  password_env: REDIS_PASSWORD
  socket_timeout_seconds: 3
  key_prefix: business-agent
  default_ttl_seconds: 3600

observer:
  sqlite_path: data/traces/agent_traces.db

agent:
  max_iterations: 2
  enable_reflection: false
  checkpoint_path: data/checkpoints/agent_checkpoints.sqlite
  require_sql_approval: false